            body {

                  overflow: hidden;
                  user-select: none;
            }

            .perspective {
                  perspective: 600px;
            }

            .wrap {
                  width: 135px;
                  height: 240px;
                  margin: 100px auto;
                  position: relative;
                  transform: rotateX(-20deg) rotateY(0deg);
                  transform-style: preserve-3d;
            }

            .wrap img {
                  display: block;
                  position: absolute;
                  width: 100%;
                  height: 100%;
                  transform: rotateY(0deg) translateZ(0px);
                  background: transparent;
                  box-shadow: 0 0 4px #fff;
                  border-radius: 5px;
            }

            /* 照片底座阴影 */
            .wrap p {
                  width: 1200px;
                  height: 1200px;
                  background: -webkit-radial-gradient(center center, 600px 600px, rgba(122, 122, 122, .5), rgba(0, 0, 0, 0));
                  position: absolute;
                  border-radius: 50%;
                  left: 50%;
                  top: 100%;
                  margin-left: -600px;
                  margin-top: -600px;
                  transform: rotateX(90deg);
            }
      </style>
</head>

      <script type="text/javascript">
            var oImg = document.getElementsByClassName('f1');
            var oImg2 = document.getElementsByClassName('f2');
            var oImg3 = document.getElementsByClassName('f3');
            var len = oImg.length;
            var deg = 360 / len;

            var oWrap = document.getElementById("imgwrap");

            // 自动旋转配置
            const autoSpeed = 0.25;    // 自动旋转速度，越大越快
            const resumeDelay = 3000;  // 松手后多少毫秒恢复自动旋转
            let autoRotate = true;
            let resumeTimer = null;

            window.onload = function () {
                  Array.prototype.forEach.call(oImg, function (ele, index) {
                        ele.style.transform = "rotateY(" + deg * index + "deg) translateZ(645.75px)";
                        ele.style.transition = "1s " + (len - index) * 0.1 + "s";
                  });
                  Array.prototype.forEach.call(oImg2, function (ele, index) {
                        ele.style.transform = "rotateY(" + deg * index + "deg) translateZ(645.75px) translateY(240px)";
                        ele.style.transition = "1s " + (len - index) * 0.1 + "s";
                  });
                  Array.prototype.forEach.call(oImg3, function (ele, index) {
                        ele.style.transform = "rotateY(" + deg * index + "deg) translateZ(645.75px) translateY(480px)";
                        ele.style.transition = "1s " + (len - index) * 0.1 + "s";
                  });
                  bindPreview(oImg);
                  bindPreview(oImg2);
                  bindPreview(oImg3);

                  // 启动渲染循环
                  requestAnimationFrame(renderLoop);
            }

            // 渲染循环，负责自动旋转
            function renderLoop() {
                  if (autoRotate) {
                        rotY += autoSpeed;
                        oWrap.style.transform = "rotateX(" + rotX + "deg) rotateY(" + rotY + "deg)";
                  }
                  requestAnimationFrame(renderLoop);
            }

            // 停止自动旋转，并设置延时恢复
            function pauseAutoRotate() {
                  autoRotate = false;
                  clearTimeout(resumeTimer);
                  resumeTimer = setTimeout(() => {
                        autoRotate = true;
                  }, resumeDelay);
            }

            function bindPreview(imgs) {
                  Array.prototype.forEach.call(imgs, function (img) {
                        img.style.cursor = "pointer";
                        img.addEventListener("click", function (e) {
                              e.stopPropagation();
                              showPreview(this.src);
                        });
                  });
            }

            function showPreview(src) {
                  var mask = document.createElement("div");
                  mask.style.cssText = "position:fixed;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,.88);z-index:9999;display:flex;align-items:center;justify-content:center;cursor:zoom-out;";

                  var bigImg = document.createElement("img");
                  bigImg.src = src;
                  bigImg.style.cssText = "max-width:92%;max-height:92%;border-radius:6px;box-shadow:0 0 20px rgba(255,255,255,.2);pointer-events:none;";

                  var closeBtn = document.createElement("div");
                  closeBtn.innerText = "✕";
                  closeBtn.style.cssText = "position:absolute;right:16px;top:16px;width:44px;height:44px;line-height:44px;text-align:center;color:#fff;font-size:26px;background:rgba(255,255,255,.18);border-radius:50%;cursor:pointer;z-index:10000;";

                  mask.appendChild(bigImg);
                  mask.appendChild(closeBtn);
                  document.body.appendChild(mask);

                  function closePreview() {
                        mask && mask.parentNode && mask.parentNode.removeChild(mask);
                  }
                  mask.addEventListener("click", closePreview);
                  closeBtn.addEventListener("click", function (e) {
                        e.stopPropagation();
                        closePreview();
                  });
            }

            // 公共变量：鼠标+触屏共用
            var newX, newY, lastX, lastY, minusX, minusY;
            var rotX = -20, rotY = 0;
            var isDragging = false;

            // ========== PC鼠标事件 ==========
            document.onmousedown = function (e) {
                  if (e.target.tagName.toLowerCase() === "img") return;
                  isDragging = true;
                  pauseAutoRotate();
                  lastX = e.clientX;
                  lastY = e.clientY;
            }
            document.onmousemove = function (e) {
                  if (!isDragging) return;
                  newX = e.clientX;
                  newY = e.clientY;
                  minusX = newX - lastX;
                  minusY = newY - lastY;
                  rotX -= minusY * 0.2;
                  rotY += minusX * 0.1;
                  oWrap.style.transform = "rotateX(" + rotX + "deg) rotateY(" + rotY + "deg)";
                  lastX = newX;
                  lastY = newY;
            }
            document.onmouseup = function () {
                  isDragging = false;
            }

            // ========== 手机触屏事件 ==========
            document.addEventListener('touchstart', function (e) {
                  var touch = e.touches[0];
                  if (e.target.tagName.toLowerCase() === "img") return;
                  isDragging = true;
                  pauseAutoRotate();
                  lastX = touch.clientX;
                  lastY = touch.clientY;
            }, {passive: true});

            document.addEventListener('touchmove', function (e) {
                  if (!isDragging) return;
                  e.preventDefault();
                  var touch = e.touches[0];
                  newX = touch.clientX;
                  newY = touch.clientY;
                  minusX = newX - lastX;
                  minusY = newY - lastY;
                  rotX -= minusY * 0.2;
                  rotY += minusX * 0.1;
                  oWrap.style.transform = "rotateX(" + rotX + "deg) rotateY(" + rotY + "deg)";
                  lastX = newX;
                  lastY = newY;
            }, {passive: false});

            document.addEventListener('touchend', function () {
                  isDragging = false;
            }, {passive: true});
      </script>
